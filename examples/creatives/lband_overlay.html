<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L-Band Overlay</title>
  <script src="../simid_protocol.js"> </script>
  <script src="base_simid_creative.js"> </script>
  <script src="lband_overlay.js"> </script>
</head>
<style>
  /* Example CSS for the L-Band */
  .left-band {
    position: absolute;
    top: 0;
    left: 0;
    width: 20%;
    /* Takes up the left side */
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
  }

  .bottom-band {
    position: absolute;
    bottom: 0;
    left: 20%;
    /* Starts after the left band */
    width: 80%;
    height: 100px;
    /* Takes up the bottom */
    background: rgba(0, 0, 0, 0.8);
  }
</style>

<body>
  <div class="left-band">
    <div class="content">LEFT</div>
  </div>

  <div class="bottom-band">
    <div class="content">BOTTOM</div>
  </div>

  </div>
</body>

</html>
