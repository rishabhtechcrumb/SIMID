<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SIMID L-Band Overlay</title>
  <style>
    /* 1. RESET AND LAYOUT */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: transparent; /* Essential for overlays */
    }

    #ad-container {
      position: relative;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Let clicks pass to video except on buttons */
    }

    /* 2. THE SIDE BAR (Left side of the L) */
    .l-band-side {
      position: absolute;
      left: 0;
      top: 0;
      width: 25%; /* 1/4 of the width */
      height: 100%;
      background: linear-gradient(to right, #111, #333);
      color: white;
      pointer-events: auto; /* Catch clicks here */
      padding: 20px;
      box-sizing: border-box;
      border-right: 2px solid #ffcc00;
    }

    /* 3. THE BOTTOM BAR (Bottom of the L) */
    .l-band-bottom {
      position: absolute;
      bottom: 0;
      left: 25%; /* Starts after the side bar */
      width: 75%;
      height: 100px;
      background: #222;
      color: white;
      pointer-events: auto;
      padding: 10px;
      box-sizing: border-box;
      border-top: 2px solid #ffcc00;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* UI ELEMENTS */
    button {
      background: #ffcc00;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
    }

    button:hover {
      background: #fff;
    }

    input {
      padding: 8px;
      border-radius: 4px;
      border: none;
    }

    #information {
      font-size: 0.9em;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div id="ad-container">
    <div class="l-band-side">
      <h2>Exclusive Offer</h2>
      <div id="information">Waiting for player...</div>
      <button id="request_skip">Skip Ad</button>
      <br><br>
      <button id="fatal_error">Simulate Error</button>
    </div>

    <div class="l-band-bottom">
      <input type="text" id="log_input" placeholder="Type a log message...">
      <button id="log_button">Log Message</button>
      
      <button id="request_pause">Pause Video</button>
      <button id="request_play">Resume</button>
      
      <div style="margin-left: auto;">
        <input type="number" id="change_duration_input" value="30" style="width: 50px;">
        <button id="change_duration_button">Set Duration</button>
      </div>
    </div>
  </div>

  <script src="https://googleads.github.io/googleads-ima-html5-simid/dist/simid_creative_base.js"></script>

  <script>
    /**
     * A SIMID L-Band Overlay Class
     */
    class SimidLBandOverlay extends BaseSimidCreative {
      constructor() {
        super();

        this.informationElem_ = document.getElementById('information');

        // Once the creative is initialized, request the L-Band resize
        this.instancePromise.then(() => {
          this.initLBandLayout();
        });

        this.addButtonClickActions_();
      }

      /**
       * Informs the player to "squeeze" the video to fit the L-Band.
       */
      initLBandLayout() {
        // We define the video's area. 
        // In our CSS, the side-bar is 25% width and bottom is 100px height.
        // We calculate based on the current player dimensions.
        const playerWidth = this.environmentData.videoDimensions.width;
        const playerHeight = this.environmentData.videoDimensions.height;

        const resizeParams = {
          x: playerWidth * 0.25, // Move video right by 25%
          y: 0,                  // Keep video at the top
          width: playerWidth * 0.75, 
          height: playerHeight - 100 // Leave 100px at bottom
        };

        this.simidProtocol.sendMessage(CreativeMessage.REQUEST_RESIZE, resizeParams)
          .then(() => console.log("L-Band resize successful"))
          .catch(() => console.error("Player refused resize. Ad may overlap video."));
      }

      /** @override */
      onTimeUpdate(data) {
        super.onTimeUpdate(data);
        this.informationElem_.innerHTML = 'Current Ad Time: ' + 
          Math.floor(this.videoState.currentTime) + 's';
      }

      addButtonClickActions_() {
        this.sendMessageOnButtonClick_('request_play', CreativeMessage.REQUEST_PLAY);
        this.sendMessageOnButtonClick_('request_pause', CreativeMessage.REQUEST_PAUSE);
        this.sendMessageOnButtonClick_('fatal_error', CreativeMessage.FATAL_ERROR);
        this.sendMessageOnButtonClick_('request_skip', CreativeMessage.REQUEST_SKIP);
        
        this.sendMessageOnLog_();
        this.sendMessageOnChangeDurationClick_();
      }

      sendMessageOnButtonClick_(elementId, message) {
        const btn = document.getElementById(elementId);
        if (btn) {
          btn.addEventListener('click', () => {
            this.simidProtocol.sendMessage(message);
          });
        }
      }

      sendMessageOnLog_() {
        document.getElementById('log_button').addEventListener('click', () => {
          const msg = document.getElementById('log_input').value;
          this.simidProtocol.sendMessage(CreativeMessage.LOG, { message: msg });
        });
      }

      sendMessageOnChangeDurationClick_() {
        document.getElementById('change_duration_button').addEventListener('click', () => {
          const duration = document.getElementById('change_duration_input').value;
          this.simidProtocol.sendMessage(CreativeMessage.REQUEST_CHANGE_AD_DURATION, {
            'duration': duration
          });
        });
      }
    }

    // Initialize the creative
    new SimidLBandOverlay();
  </script>
</body>
</html>
