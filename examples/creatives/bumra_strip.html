<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMID Full Overlay Ad</title>
    <script src="../simid_protocol.js"> </script>
    <script src="base_simid_creative.js"> </script>
    <script src="bumra_strip.js"> </script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Full screen overlay image */
        .full-screen-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://cdn-temp.uppixl.com/pleased-cyan-mouse-emeline/ChatGPT%20Image%20May%2013,%202026,%2005_12_39%20PM%201.png');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .bottom-strip {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px; /* Increased padding since weather is gone */
            box-sizing: border-box;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .controls-section {
            display: flex;
            gap: 12px;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #skip_btn {
            background: #d32f2f;
            border: none;
            font-weight: bold;
        }

        #skip_btn:hover {
            background: #b71c1c;
        }

        .time-section {
            text-align: right;
        }

        #time_indicator {
            font-family: 'Courier New', Courier, monospace;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="full-screen-image"></div>

</body>
</html>
