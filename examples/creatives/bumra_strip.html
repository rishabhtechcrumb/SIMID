<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMID Interactive Hotspots</title>

    <script src="../simid_protocol.js"></script>
    <script src="base_simid_creative.js"></script>
    <script src="bumra_strip.js"></script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #ad-container {
            position: relative;
            width: 100%;
            max-width: 1672px;
            aspect-ratio: 1672 / 941;
            margin: 0 auto;

            background-image: url('https://cdn-temp.uppixl.com/pleased-cyan-mouse-emeline/img1%201.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            transition: background-image 0.3s ease-in-out;
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 10;

            border: 2px dashed yellow;
            background: rgba(255, 255, 255, 0.2);

            box-sizing: border-box;

            width: 20.39%;
            height: 31.67%;
            top: 68.33%;
        }

        /* Original */
        #box3 {
            left: 32.95%;
        }

        /* Shifted right by one box width */
        #box4 {
            left: 53.34%;
            /* 32.95 + 20.39 */
        }

        /* Shifted right again */
        #box5 {
            left: 73.73%;
            /* 53.34 + 20.39 */
        }
    </style>
</head>

<body>

    <div id="ad-container">
        <div id="box3" class="hotspot"></div>
        <div id="box4" class="hotspot"></div>
        <div id="box5" class="hotspot"></div>
    </div>

    <script>
        const container = document.getElementById('ad-container');

        const img1 = "https://cdn-temp.uppixl.com/pleased-cyan-mouse-emeline/img1%201.png";
        const img2 = "https://cdn-temp.uppixl.com/pleased-cyan-mouse-emeline/img2%201.png";
        const img3 = "https://cdn-temp.uppixl.com/pleased-cyan-mouse-emeline/img3%201.png";

        const images = [img1, img2, img3];

        // PRELOAD ALL IMAGES
        function preloadImages(imageUrls) {
            return Promise.all(
                imageUrls.map((url) => {
                    return new Promise((resolve, reject) => {
                        const img = new Image();

                        img.onload = () => resolve(url);
                        img.onerror = () => reject(url);

                        img.src = url;
                    });
                })
            );
        }

        preloadImages(images)
            .then(() => {
                console.log("All images preloaded");
            })
            .catch((err) => {
                console.error("Failed to preload:", err);
            });

        document.getElementById('box3').addEventListener('click', () => {
            container.style.backgroundImage = `url('${img1}')`;
        });

        document.getElementById('box4').addEventListener('click', () => {
            container.style.backgroundImage = `url('${img2}')`;
        });

        document.getElementById('box5').addEventListener('click', () => {
            container.style.backgroundImage = `url('${img3}')`;
        });
    </script>

</body>

</html>
